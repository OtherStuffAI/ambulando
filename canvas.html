<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Canvas · Ambulando</title>
  <link rel="icon" href="/ambulando/favicon-32.png">
  <script>try{const v=localStorage.getItem('ambulando:theme')||'system';const d=v==='dark'||(v==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}catch{}</script>
</head>
<body>
  <main class="canvas-app" x-data>
    <header class="canvas-toolbar">
      <div class="canvas-brand"><img src="/ambulando/confluence-approved.png" alt=""><h1 x-text="$store.canvas.canvas?.title || 'Canvas'"></h1></div>
      <div class="canvas-toolbar-scroll" x-show="$store.canvas.status === 'ready'" x-cloak>
        <div class="canvas-toolbar-group canvas-tools" x-show="$store.canvas.canvas?.can_manage">
          <button type="button" title="Select (V)" :class="{ active: $store.canvas.tool === 'select' }" @click="$store.canvas.setTool('select')">↖</button>
          <button type="button" title="Hand / pan (H)" :class="{ active: $store.canvas.tool === 'hand' }" @click="$store.canvas.setTool('hand')">✋</button>
          <button type="button" title="Rectangle (R)" :class="{ active: $store.canvas.tool === 'rectangle' }" @click="$store.canvas.setTool('rectangle')">▭</button>
          <button type="button" title="Diamond (D)" :class="{ active: $store.canvas.tool === 'diamond' }" @click="$store.canvas.setTool('diamond')">◇</button>
          <button type="button" title="Ellipse (O)" :class="{ active: $store.canvas.tool === 'ellipse' }" @click="$store.canvas.setTool('ellipse')">○</button>
          <button type="button" title="Arrow (A)" :class="{ active: $store.canvas.tool === 'arrow' }" @click="$store.canvas.setTool('arrow')">→</button>
          <button type="button" title="Line (L)" :class="{ active: $store.canvas.tool === 'line' }" @click="$store.canvas.setTool('line')">╱</button>
          <button type="button" title="Free draw (P)" :class="{ active: $store.canvas.tool === 'draw' }" @click="$store.canvas.setTool('draw')">〰</button>
          <button type="button" title="Text (T)" :class="{ active: $store.canvas.tool === 'text' }" @click="$store.canvas.setTool('text')">T</button>
          <button type="button" title="Eraser (E)" :class="{ active: $store.canvas.tool === 'eraser' }" @click="$store.canvas.setTool('eraser')">⌫</button>
          <button type="button" title="Frame (F)" :class="{ active: $store.canvas.tool === 'frame' }" @click="$store.canvas.setTool('frame')">▣</button>
          <button type="button" title="Group selected (Ctrl/Cmd+G)" :disabled="!$store.canvas.canGroup" @click="$store.canvas.createGroup()">Group</button>
          <button type="button" title="Embed naplet" :class="{ active: $store.canvas.tool === 'embed' }" @click="$store.canvas.setTool('embed')">＋</button>
        </div>
        <div class="canvas-toolbar-group">
          <button type="button" title="Comment (C)" :class="{ active: $store.canvas.tool === 'comment' }" @click="$store.canvas.setTool('comment')">💬<span class="canvas-count" x-show="$store.canvas.unresolvedComments.length" x-text="$store.canvas.unresolvedComments.length"></span></button>
          <button type="button" title="Undo (Ctrl/Cmd+Z)" :disabled="!$store.canvas.canUndo" @click="$store.canvas.undoChange()">↶</button>
          <button type="button" title="Redo (Ctrl/Cmd+Shift+Z)" :disabled="!$store.canvas.canRedo" @click="$store.canvas.redoChange()">↷</button>
          <button type="button" title="Duplicate (Ctrl/Cmd+D)" :disabled="!$store.canvas.selected" @click="$store.canvas.duplicateSelected()">⧉</button>
          <button type="button" title="Send backward" :disabled="!$store.canvas.selected" @click="$store.canvas.orderSelected(-1)">↓</button>
          <button type="button" title="Bring forward" :disabled="!$store.canvas.selected" @click="$store.canvas.orderSelected(1)">↑</button>
          <button type="button" title="Delete" :disabled="!$store.canvas.selected" @click="$store.canvas.deleteItem()">Delete</button>
        </div>
        <div class="canvas-toolbar-group"><button type="button" @click="$store.canvas.zoomBy(0.9)" aria-label="Zoom out">−</button><button type="button" @click="$store.canvas.resetViewport()" x-text="Math.round($store.canvas.viewport.scale * 100) + '%'" aria-label="Reset zoom"></button><button type="button" @click="$store.canvas.zoomBy(1.1)" aria-label="Zoom in">+</button><button type="button" @click="$store.canvas.fitToContent()">Fit</button></div>
        <div class="canvas-toolbar-group"><button type="button" x-show="$store.canvas.canvas?.can_manage" @click="$store.canvas.openAddDialog()">Add naplet</button><button type="button" @click="$store.canvas.refresh()">Refresh</button><button type="button" @click="window.close()" title="Close this canvas tab">Close</button></div>
      </div>
    </header>
    <section class="canvas-status" x-show="$store.canvas.status !== 'ready'"><div><h1 x-text="$store.canvas.status === 'loading' ? 'Opening canvas…' : 'Canvas unavailable'"></h1><p :class="{ 'canvas-error': $store.canvas.status === 'error' }" x-text="$store.canvas.error"></p><button type="button" x-show="$store.canvas.status === 'error'" @click="$store.canvas.refresh()">Try again</button></div></section>
    <section class="canvas-stage" x-ref="stage" x-show="$store.canvas.status === 'ready'" x-cloak :class="'tool-' + $store.canvas.tool" @wheel="$store.canvas.handleWheel($event)" @pointerdown="$store.canvas.handleStagePointerDown($event)" @pointermove="$store.canvas.movePointer($event)" @pointerup="$store.canvas.endPointer($event)" @pointercancel="$store.canvas.cancelPointer($event)">
      <div class="canvas-world" :style="{ transform: $store.canvas.transformStyle }">
        <template x-for="element in $store.canvas.elements" :key="element.id"><article class="canvas-element" :data-canvas-key="'element:' + element.id" :class="['kind-' + element.kind, { selected: $store.canvas.selectionHas('element', element.id), 'canvas-group': $store.canvas.isGroup(element) }]" :style="$store.canvas.elementStyle(element)" @pointerdown.stop="$store.canvas.startItemInteraction('element', element, $event)" @dblclick.stop="$store.canvas.beginTextEdit(element)">
          <div class="canvas-shape" x-show="['rectangle','diamond','ellipse','frame'].includes(element.kind)"><span x-show="element.kind === 'frame'" x-text="$store.canvas.isGroup(element) ? (element.data.label || 'Group') : 'Frame'"></span></div>
          <p class="canvas-text" x-show="element.kind === 'text' && $store.canvas.editingTextId !== element.id" x-text="element.data.text"></p>
          <textarea x-show="element.kind === 'text' && $store.canvas.editingTextId === element.id" :data-text-editor="element.id" x-model="$store.canvas.editingText" @pointerdown.stop @blur="$store.canvas.saveTextEdit(element)" @keydown.meta.enter.prevent="$store.canvas.saveTextEdit(element)" @keydown.ctrl.enter.prevent="$store.canvas.saveTextEdit(element)"></textarea>
          <svg x-show="['arrow','line','draw'].includes(element.kind)" :viewBox="$store.canvas.vectorViewBox(element)" preserveAspectRatio="none" aria-hidden="true"><defs><marker :id="'arrow-' + element.id" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z"></path></marker></defs><line x-show="element.kind !== 'draw'" :x1="$store.canvas.vectorStart(element)[0]" :y1="$store.canvas.vectorStart(element)[1]" :x2="$store.canvas.vectorEnd(element)[0]" :y2="$store.canvas.vectorEnd(element)[1]" :marker-end="element.kind === 'arrow' ? 'url(#arrow-' + element.id + ')' : ''"></line><polyline x-show="element.kind === 'draw'" :points="$store.canvas.drawPoints(element)"></polyline></svg>
          <button class="canvas-arrow-handle" x-show="['arrow','line'].includes(element.kind) && $store.canvas.selectionHas('element', element.id)" :style="$store.canvas.arrowHandleStyle(element, 'start')" aria-label="Adjust arrow start" @pointerdown.stop="$store.canvas.startItemInteraction('element', element, $event, 'arrow-start')"></button>
          <button class="canvas-arrow-handle" x-show="['arrow','line'].includes(element.kind) && $store.canvas.selectionHas('element', element.id)" :style="$store.canvas.arrowHandleStyle(element, 'end')" aria-label="Adjust arrow end" @pointerdown.stop="$store.canvas.startItemInteraction('element', element, $event, 'arrow-end')"></button>
          <button class="canvas-resize" x-show="$store.canvas.selected?.type === 'element' && $store.canvas.selected.id === element.id" aria-label="Resize element" @pointerdown.stop="$store.canvas.startItemInteraction('element', element, $event, 'resize')"></button>
        </article></template>
        <article class="canvas-element canvas-preview" x-show="$store.canvas.interaction?.type === 'create'" :class="'kind-' + ($store.canvas.interaction?.element?.kind || '')" :style="$store.canvas.interaction?.element ? $store.canvas.elementStyle($store.canvas.interaction.element) : ''"><div class="canvas-shape"></div></article>
        <template x-for="naplet in $store.canvas.naplets" :key="naplet.id"><article class="canvas-naplet" :data-canvas-key="'naplet:' + naplet.id" :class="{ selected: $store.canvas.selectionHas('naplet', naplet.id) }" :style="$store.canvas.napletStyle(naplet)">
          <header class="canvas-naplet-header" @pointerdown.stop="$store.canvas.startItemInteraction('naplet', naplet, $event)"><strong x-text="naplet.access === 'denied' ? 'Restricted item' : naplet.title"></strong><span class="canvas-naplet-kind" x-text="naplet.access === 'denied' ? '' : naplet.source.type.replace('_', ' ')"></span><span class="canvas-count" x-show="$store.canvas.commentCountForNaplet(naplet.id)" x-text="$store.canvas.commentCountForNaplet(naplet.id)"></span></header>
          <div class="canvas-denied" x-show="naplet.access === 'denied'"><p x-text="$store.canvas.accessMessage"></p></div>
          <div class="canvas-naplet-body" x-show="naplet.access === 'ready' && naplet.source?.type === 'document'"><h2 x-text="naplet.content.title || naplet.title"></h2><pre x-text="naplet.content.body || ''"></pre></div>
          <div class="canvas-naplet-body" x-show="naplet.access === 'ready' && naplet.source?.type === 'task_list'"><ol><template x-for="task in naplet.content.tasks || []" :key="task.id"><li><strong x-text="task.title"></strong><span x-text="task.state ? ' · ' + task.state : ''"></span></li></template></ol></div>
          <div class="canvas-naplet-body" x-show="naplet.access === 'ready' && naplet.source?.type === 'chat_thread'"><ol><template x-for="message in naplet.content.messages || []" :key="message.id"><li><strong x-text="message.author || 'Workspace member'"></strong><pre x-text="message.body || ''"></pre></li></template></ol></div>
          <iframe x-show="naplet.access === 'ready' && naplet.source?.type === 'html'" :title="naplet.title" sandbox="allow-scripts" credentialless referrerpolicy="no-referrer" :srcdoc="$store.canvas.htmlDocument(naplet)"></iframe>
          <button class="canvas-resize" x-show="$store.canvas.selected?.type === 'naplet' && $store.canvas.selected.id === naplet.id" aria-label="Resize naplet" @pointerdown.stop="$store.canvas.startItemInteraction('naplet', naplet, $event, 'resize')"></button>
        </article></template>
        <template x-for="comment in $store.canvas.unresolvedComments" :key="comment.id"><button type="button" class="canvas-comment-marker" :style="$store.canvas.commentStyle(comment)" :aria-label="'Open comment by ' + comment.author.label" @pointerdown.stop @click.stop="$store.canvas.openCommentThread(comment)">💬</button></template>
      </div>
      <div class="canvas-pan-shield" x-show="$store.canvas.tool === 'hand'" aria-hidden="true"></div>
      <div class="canvas-selection-box" x-show="$store.canvas.selectionBox" :style="$store.canvas.selectionBoxStyle()" aria-hidden="true"></div>
    </section>
    <p class="canvas-toast" role="alert" x-show="$store.canvas.error && $store.canvas.status === 'ready'" x-text="$store.canvas.error" x-cloak></p>
    <dialog class="canvas-dialog canvas-add-dialog" x-ref="addDialog"><form method="dialog" @submit.prevent="$store.canvas.addNaplet()"><h2>Add naplet</h2><label>Type<select x-model="$store.canvas.addDialog.type" @change="$store.canvas.addDialog.sourceId = ''; $store.canvas.addDialog.title = ''"><option value="document">Document</option><option value="task_list">Task list</option><option value="chat_thread">Chat thread</option><option value="html">HTML artefact</option></select></label><label>Find a source<input autocomplete="off" x-model="$store.canvas.sourceSearch" placeholder="Search visible records"></label><div class="canvas-source-list"><template x-for="option in $store.canvas.filteredSourceOptions" :key="option.type + option.id"><button type="button" :class="{ selected: $store.canvas.addDialog.sourceId === option.id }" @click="$store.canvas.chooseSource(option)" x-text="option.title"></button></template><p x-show="!$store.canvas.filteredSourceOptions.length">No cached visible sources of this type. Refresh Ambulando first.</p></div><label>Display title (optional)<input maxlength="120" x-model="$store.canvas.addDialog.title"></label><p>The selected source is checked independently. People without source access see no title, type, ID or content.</p><div class="canvas-dialog-actions"><button type="button" @click="$refs.addDialog.close()">Cancel</button><button type="submit" :disabled="$store.canvas.saving || !$store.canvas.addDialog.sourceId" x-text="$store.canvas.saving ? 'Adding…' : 'Add'"></button></div></form></dialog>
    <dialog class="canvas-dialog canvas-comment-dialog" x-ref="commentDialog"><form method="dialog" @submit.prevent="$store.canvas.submitComment()"><h2 x-text="$store.canvas.commentDialog.parentCommentId ? 'Reply' : 'New comment'"></h2><label>Comment<textarea required maxlength="10000" x-model="$store.canvas.commentDialog.body"></textarea></label><div class="canvas-dialog-actions"><button type="button" @click="$refs.commentDialog.close()">Cancel</button><button type="submit" :disabled="$store.canvas.saving || !$store.canvas.commentDialog.body.trim()">Post</button></div></form></dialog>
    <dialog class="canvas-dialog canvas-comment-panel" x-ref="commentPanel"><div x-show="$store.canvas.activeComment"><header><h2>Comment thread</h2><button type="button" @click="$refs.commentPanel.close()">Close</button></header><article><strong x-text="$store.canvas.activeComment?.author.label"></strong><time x-text="$store.canvas.activeComment?.created_at"></time><p x-text="$store.canvas.activeComment?.body"></p></article><template x-for="reply in $store.canvas.activeReplies" :key="reply.id"><article><strong x-text="reply.author.label"></strong><time x-text="reply.created_at"></time><p x-text="reply.body"></p></article></template><div class="canvas-dialog-actions"><button type="button" @click="$store.canvas.openCommentDialog($store.canvas.activeComment.anchor, $store.canvas.activeComment.id)">Reply</button><button type="button" x-show="!$store.canvas.activeComment?.resolved_at" @click="$store.canvas.setCommentResolved($store.canvas.activeComment, true)">Resolve</button><button type="button" x-show="$store.canvas.activeComment?.resolved_at" @click="$store.canvas.setCommentResolved($store.canvas.activeComment, false)">Reopen</button></div></div></dialog>
  </main>
  <script type="module" src="/src/canvas/page.js"></script>
</body>
</html>
