<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily tracker</title><link rel="stylesheet" href="style.css"></head><body>

<main><header><p class="eyebrow">A moment for yourself</p><h1>Daily tracker</h1><p class="subtle">Your metrics. One day at a time.</p></header>

<div id="controls" hidden><nav><button id="checkin" type="button">Check in</button><button id="manage" type="button">Metrics</button><button id="history" type="button">History</button></nav><div class="date-row"><label>Day <input id="date" type="date"></label><button id="today" type="button">Today</button></div><section id="content"></section><footer><button id="save" class="primary" type="button">Save to NStack</button><button id="reload" type="button">Reload saved</button><p class="subtle">Private conversation storage · normal NStack access rules apply. Unsaved edits stay only while this napplet is open.</p></footer></div>
</main><script src="model.js"></script><script src="app.js"></script></body></html>
