<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Metrics</title><link rel="stylesheet" href="style.css"></head><body>
<script type="application/json" id="wingman-napplet-manifest">{"version":1,"app_id":"daily-tracker","bindings":{"tracker":{"format":"daily-tracker-v1","operations":["read","save"],"privacy":"self"}}}</script>
<main><header><p class="eyebrow">Daily check-in</p><h1>Daily Metrics</h1><p class="subtle">Track your daily habits and measurements.</p></header>
<p id="status" role="status" aria-live="polite">Open this napplet from Ambulando to load your private tracker.</p>
<div id="controls" hidden><nav aria-label="Tracker views"><button id="checkin" type="button">Check in</button><button id="manage" type="button">Metrics</button><button id="history" type="button">History</button></nav><div class="date-row"><button id="previous" type="button" aria-label="Previous day">←</button><label>Day <input id="date" type="date"></label><button id="next" type="button" aria-label="Next day">→</button><button id="today" type="button">Today</button></div><div class="save-actions"><button id="save" class="primary" type="button">Save to NStack</button><button id="reload" type="button">Reload saved</button></div><section id="content" aria-label="Daily metrics"></section><footer><p class="subtle privacy">Private conversation storage · normal NStack access rules apply. Unsaved edits stay only while this napplet is open.</p></footer></div>
</main><script src="model.js"></script><script src="app.js"></script></body></html>
